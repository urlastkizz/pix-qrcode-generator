<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de QR Code Pix</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main>
      <h1>Gerador de QR Code Pix</h1>

      <form id="pix-form">
        <div>
          <label for="amount">Valor (R$)</label>
          <input type="number" id="amount" name="amount" min="0.01" step="0.01">
        </div>

        <div>
          <label for="pix-key">Chave PIX</label>
          <input type="text" id="pix-key" name="pix-key" required>
        </div>

        <div>
          <label for="recipient-name">Nome do recebedor</label>
          <input type="text" id="recipient-name" name="recipient-name" required>
        </div>

        <div>
          <label for="city">Cidade</label>
          <input type="text" id="city" name="city" required>
        </div>

        <button type="submit">Gerar QR Code</button>
      </form>

      <div id="qrcode"></div>

      <div>
        <label for="pix-code">Pix Copia e Cola</label>
        <textarea id="pix-code" rows="5" cols="40" readonly></textarea>
      </div>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="script.js"></script>
  </body>
</html>
